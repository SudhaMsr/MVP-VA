# One-off: copy the onnxruntime-web runtime into docs/vendor so the app does not depend on a CDN.
name: Vendor onnxruntime-web
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm pack onnxruntime-web@1.17.3
          tar xzf onnxruntime-web-1.17.3.tgz
          mkdir -p docs/vendor/ort
          ls package/dist
          cp package/dist/ort.min.js docs/vendor/ort/
          cp package/dist/*.wasm docs/vendor/ort/
          cp package/dist/ort-wasm*.worker.js docs/vendor/ort/ 2>/dev/null || true
          cp package/LICENSE* docs/vendor/ort/ 2>/dev/null || true
          ls -la docs/vendor/ort
          rm -rf package onnxruntime-web-1.17.3.tgz
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/vendor
          git commit -m "Vendor onnxruntime-web 1.17.3 (self-hosted runtime)" || echo "nothing to commit"
          git push
