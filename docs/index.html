<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Vision Assist</title>
<style>
  :root { --bg:#000; --fg:#fff; --accent:#ffd400; --ok:#1fd655; --danger:#ff5a5a; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; }
  body { padding: 16px; max-width: 640px; margin: 0 auto; font-size: 1.15rem; line-height: 1.4; }
  h1 { font-size: 1.8rem; margin: 4px 0 8px; }
  p.notice { border:2px solid var(--accent); border-radius:12px; padding:10px 12px; margin:8px 0 16px; }
  button { width:100%; min-height: 84px; margin: 0 0 12px; border-radius: 16px; border: 3px solid var(--fg);
           background:#111; color:var(--fg); font-size:1.6rem; font-weight:700; }
  button:focus-visible { outline: 6px solid var(--accent); outline-offset: 3px; }
  #startBtn { min-height: 160px; background: var(--ok); color:#000; border-color:#000; font-size: 2.2rem; }
  #stopBtn { background: var(--danger); color:#000; border-color:#000; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row button { margin:0 0 12px; font-size:1.3rem; }
  #status { font-size:1.4rem; font-weight:700; margin: 8px 0; }
  #lastAlert { font-size:1.3rem; color: var(--accent); min-height: 1.6em; margin:4px 0 12px; }
  #stats { font-size: .95rem; opacity:.85; margin-top: 8px; }
  .preview { position:relative; margin-top: 12px; aspect-ratio: 4 / 3; overflow:hidden; border-radius:12px; background:#111; }
  .preview video, .preview canvas { width:100%; height:100%; object-fit:contain; display:block; }
  .preview canvas { position:absolute; inset:0; pointer-events:none; }
  body:not(.debug) .preview { display:none; }
  .small { font-size:.95rem; opacity:.85; }
</style>
</head>
<body>
<main>
  <h1>Vision Assist</h1>
  <p class="notice">Test prototype. It can miss obstacles and can be wrong. Always use your cane or guide dog as well.</p>

  <button id="startBtn" type="button" aria-label="Start Vision Assist">Start</button>
  <div class="row">
    <button id="stopBtn" type="button" aria-label="Stop Vision Assist">Stop</button>
    <button id="repeatBtn" type="button" aria-label="Repeat last alert">Repeat</button>
  </div>
  <button id="readBtn" type="button" aria-label="Read the text in front of the camera aloud" style="min-height:84px">Read</button>
  <button id="micBtn" type="button" aria-label="Voice commands" aria-pressed="false">Voice commands off</button>

  <form id="navForm" style="margin:0 0 12px">
    <label for="navInput" style="display:block;font-weight:700;margin-bottom:6px">Walk to (or say "navigate to ...")</label>
    <input id="navInput" type="text" autocomplete="off" placeholder="e.g. Tesco, High Street" style="width:100%;min-height:64px;font-size:1.3rem;padding:0 12px;border-radius:12px;border:3px solid #fff;background:#111;color:#fff">
    <div class="row" style="margin-top:12px">
      <button id="navGo" type="submit" style="margin:0;font-size:1.3rem">Go</button>
      <button id="navCancel" type="button" style="margin:0;font-size:1.3rem">Cancel route</button>
    </div>
  </form>

  <p id="status" role="status" aria-live="polite">Ready. Tap start.</p>
  <p id="lastAlert" aria-live="off"></p>
  <p id="stats" aria-hidden="true"></p>

  <div class="preview" aria-hidden="true">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <button id="saveRecBtn" type="button" hidden disabled aria-label="Save the test recording and log" style="min-height:64px;font-size:1.1rem;margin-top:16px">Save recording</button>
  <button id="logBtn" type="button" aria-label="Save session log for the test team" style="min-height:56px;font-size:1rem;margin-top:16px">Save session log</button>
  <p class="small">Say: start, stop, repeat, help. For testers: add ?debug to see the camera view and boxes, and ?record to record a test video and log.</p>
</main>

<script>
  // Opt-in speed experiment: ?mt=1 registers a service worker that enables multi-threaded detection.
  try {
    if (/[?&]mt=1/.test(location.search) && !self.crossOriginIsolated && 'serviceWorker' in navigator
        && !sessionStorage.getItem('coiTried')) {
      sessionStorage.setItem('coiTried', '1');
      navigator.serviceWorker.register('coi-sw.js').then(() => navigator.serviceWorker.ready)
        .then(() => location.reload()).catch(() => {});
    }
  } catch (e) { /* ignore */ }
</script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
